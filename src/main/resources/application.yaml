spring:
  application:
    name: luxmedscheduler

logging:
  file:
    name: logs/luxmedscheduler.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

luxmed:
  auth:
    base-url: https://portalpacjenta.luxmed.pl
    login: ${LUXMED_LOGIN:}
    password: ${LUXMED_PASSWORD:}
  monitor:
    cron: "0 */5 * * * *"
#   service-variant-id - нужно указывать вручную. Этот параметр обозначает услугу.
#    4502 - Konsultacja internistyczna
#    13410 - Konsultacja internistyczna - telefoniczna
#    4436  - Konsultacja ortopedyczna
#    4448 - Konsultacja dermatologiczna
#    8999 - Pobranie krwi - i innych materiałów - na czczo
#    14266 - Pobranie krwi - i innych materiałów - nie na czczo
#    4430 - Konsultacja proktologiczna
    service-variant-id: 4502
